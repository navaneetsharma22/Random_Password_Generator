<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="wrapper">
        <h1>Weather App</h1>
        <div class="tab-container">
            <p class="tab" data-userWeather>Your Weather</p>
            <p class="tab" data-searchWeather > Search Weather </p>
        
        </div>

        <div class="weather-container">
            <!-- grant location container -->
            <div class="sub-container grant-location-container">
            
            <img src="./image/location.png" width="80" height="80" loading="lazy">
             <p>Grant Location Access</p>
             <p>Allow access To Get Weather information </p>
             <button class="Btn" data-grantAccess>GRANT ACCESS</button>
            
            </div>
          

             <!--Search forms-->
            <form class="form-container"  data-searchForm>
                <input placeholder="Search for City... " data-searchInput>
                <button class="btn">
                    <img src="./image/search.png" width="20" height="20" loading="lazy">
                </button>
            </form>

            <!--Loading screen container -->
            <div class="sub-container  loading-container">
                <img src="./image/loading.gif" width="150"  height="150">
                <p>Loading</p>
            </div>

            <!-- Error container -->
            <div class="sub-container error-container">
                <p data-errorMessage></p>

            </div>


            <!-- show weather info -->
             <div class="sub-container user-info-container">
                <div class="name">
                    <p data-cityName></p>
                    <img data-countryIcon>

                </div>

                <p  data-weatherDesc></p>

                <img data-weatherIcon>

                <p data-temrature></p>
                <!--3 card parameter-->
                <div class="parameter-container">

                    <!--card 1-->
                    <div class="parameter">
                        <img src="./image/wind.png" >
                        <p>windspeed</p>
                        <p data-windspeed></p>
                    </div>

                    <!-- card 2-->
                    <div class="parameter">
                        <img src="./image/humidity.png" >
                        <p>humidity</p>
                        <p data-humidity></p>
                    </div>

                    <!-- card 3-->
                     <div class="parameter">
                        <img src="./image/cloud.png" >
                        <p>Clouds</p>
                        <p data-cloudiness></p>
                    </div>


                </div>

             </div>
             

            
        </div>


    </div>










<script src="main.js"> </script>
</body>
</html>
